<style>

html,body{background:#171a1c!important;color:#fff!important;font-family:Inter,system-ui,sans-serif}.pj-hero-img{object-fit:contain;background:#1d2226;max-height:65vh}.case-section{border:1px solid #30383e;border-radius:16px;background:#1d2226;padding:24px;margin-top:24px}.case-section h2{font-family:Sora;font-size:20px;font-weight:700;margin:0 0 12px}.case-section p,.case-section li{color:#acb4b9;line-height:1.8}.case-section ul{padding-left:20px;list-style:disc}.pj-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.pj-list a{border:1px solid #30383e;border-radius:14px;padding:16px;background:#1d2226}.pj-list img{width:100%;height:200px;object-fit:cover;border-radius:9px;margin-bottom:12px}@media(max-width:600px){.pj-list{grid-template-columns:1fr}.case-section{padding:20px}.pj-hero-img{border-radius:14px}}.case-section{position:relative;overflow:hidden;border-color:#303b45;background:linear-gradient(135deg,#1d252c,#1a1f23);box-shadow:0 10px 26px #0002}.case-section h2{display:flex;align-items:center;gap:12px;font-size:19px}.case-icon{display:inline-grid;place-items:center;flex-shrink:0;width:34px;height:34px;border:1px solid #4294ff55;border-radius:10px;background:#4294ff16;color:#74b1ff;font:600 22px Arial}.case-outcome .case-icon{color:#7ed6b0;background:#58b28b16;border-color:#58b28b55}.case-section p{font-size:15px}.case-section{animation:case-in .6s ease both}@keyframes case-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.case-section{animation:none}} .pj-hero-img{max-height:160px;max-width:280px;display:block;margin:0 auto 20px}.gallery-section{margin-top:28px}.gallery-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.gallery-heading h2{font:700 20px Sora;margin:0}.gallery-heading>span{color:#acb4b9;font-size:11px}.pj-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.pj-shot{margin:0;border-color:#34404a;background:#20272d;min-width:0}.shot-open{width:100%;height:230px;position:relative;display:block;padding:10px;border:0;background:linear-gradient(140deg,#23384b,#22272b);cursor:zoom-in}.pj-shot:nth-child(3n+2) .shot-open{background:linear-gradient(140deg,#323047,#25272d)}.pj-shot:nth-child(3n) .shot-open{background:linear-gradient(140deg,#223b38,#22282a)}.pj-shot img{height:100%;width:100%;object-fit:contain;border-radius:5px}.pj-shot figcaption{font-size:12px;line-height:1.5;padding:10px 12px;min-height:55px}.shot-zoom{position:absolute;bottom:14px;inset-inline-end:14px;background:#161c24e6;border:1px solid #ffffff30;border-radius:8px;width:25px;height:25px;color:#83baff;display:grid;place-items:center}.shot-dialog{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;border:0;margin:0;padding:58px 14px 20px;background:#101519f5;color:#fff;overflow:auto}.shot-dialog::backdrop{background:#080c10ed}.shot-dialog img{max-width:100%;max-height:calc(100dvh - 125px);width:auto;height:auto;object-fit:contain;margin:auto;display:block}.shot-dialog p{text-align:center;font-size:13px;margin:15px auto 0;max-width:650px;color:#c6d1db}.shot-close{position:fixed;top:12px;inset-inline-end:15px;border:1px solid #ffffff40;border-radius:50%;background:#26313d;color:#fff;font-size:26px;width:38px;height:38px;cursor:pointer}@media(max-width:600px){.pj-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.shot-open{height:206px;padding:8px}.pj-shot figcaption{font-size:11px;padding:9px;min-height:53px}.gallery-heading h2{font-size:18px}.pj-hero-img{max-height:120px;max-width:220px}.case-section{margin-top:18px}} </style>

<body class="font-body antialiased bg-background text-foreground min-h-screen">
<div class="container mx-auto px-4 sm:px-6 py-8 max-w-4xl">
<a href="/#projects" style="display:inline-flex;align-items:center;gap:.4rem;color:hsl(var(--muted-foreground));font-size:.85rem;margin-bottom:1.5rem">&larr; All projects</a>
<div id="app"><p style="color:hsl(var(--muted-foreground))">Loading&hellip;</p></div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
Promise.all([fetch('/api/bootstrap').then(r=>r.json()),fetch('/case-studies.json').then(r=>r.json()),fetch('/project-gallery.json').then(r=>r.json())]).then(function(results){var d=results[0],cases=results[1],galleries=results[2];
  var data = d.data || d;
  var id = new URLSearchParams(location.search).get('id');
  var list = data.projects || [];list.forEach(p=>{if(cases[p.id]){p.caption=cases[p.id].caption;p.caseStudy=cases[p.id];if(cases[p.id].stack)p.tech=cases[p.id].stack;}});
  var p = list.filter(function(x){return String(x.id)===id})[0] || list.filter(function(x){return x.name===id})[0];
  var app = document.getElementById('app');
  if(!id){app.innerHTML='<h1 style="font:700 32px Sora;margin-bottom:24px">Project Library</h1><div class="pj-list">'+list.map(function(x){return '<a href="/project.html?id='+encodeURIComponent(x.id)+'">'+(x.image?'<img src="'+esc(x.image)+'" alt="'+esc(x.name)+'">':'')+'<h2>'+esc(x.name)+'</h2><p style="color:#acb4b9;font-size:13px">'+esc(x.tagline)+'</p></a>'}).join('')+'</div>';return;}
  if(!p){ app.innerHTML = '<p style="color:hsl(var(--muted-foreground))">Project not found. <a href="/#projects" style="color:hsl(var(--primary))">Back to projects</a></p>'; return; }
  document.title = p.name + ' | Eng. Angluos Rezq';
  var h = '';
  if(p.image) h += '<img class="pj-hero-img" src="'+esc(p.image)+'" alt="'+esc(p.name)+'"/>';
  h += '<div style="margin-top:1.5rem;display:flex;flex-wrap:wrap;align-items:center;gap:.7rem">';
  h += '<h1 class="font-headline" style="font-size:clamp(1.6rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em">'+esc(p.name)+'</h1>';
  if(p.category) h += '<span class="pj-chip">'+esc(p.category)+'</span>';
  if(p.status) h += '<span class="pj-chip" style="background:rgba(255,255,255,.06);color:hsl(var(--muted-foreground))">'+esc(p.status)+'</span>';
  h += '</div>';
  if(p.tagline) h += '<p data-project-tagline class="text-gradient font-headline" style="font-weight:700;font-size:1.05rem;margin-top:.4rem">'+esc(p.tagline)+'</p>';
  if(p.descriptionEn||p.description) h += '<p data-project-description style="color:hsl(var(--muted-foreground));margin-top:1rem;line-height:1.7;max-width:46rem">'+esc(p.descriptionEn)+'</p>';

  var shots = galleries[p.id] || (Array.isArray(p.screenshots) ? p.screenshots : []);
  if(shots.length){
    h += '<section class="gallery-section"><div class="gallery-heading"><h2>Screenshots</h2><span>Tap to enlarge</span></div><div class="pj-grid">';
    shots.forEach(function(s,i){if(!s||!s.image)return;h+='<figure class="pj-shot"><button type="button" class="shot-open" data-shot="'+i+'" aria-label="'+esc(s.captionEn||s.caption||p.name)+'"><img src="'+esc(s.image)+'" alt="'+esc(s.captionEn||s.caption||p.name)+'" loading="lazy" decoding="async"/><span class="shot-zoom" aria-hidden="true">↗</span></button><figcaption data-gallery-en="'+esc(s.captionEn||s.caption||p.name)+'" data-gallery-ar="'+esc(s.caption||s.captionEn||p.name)+'">'+esc(s.captionEn||s.caption||p.name)+'</figcaption></figure>'});
    h+='</div></section>';
  }
  if(p.caseStudy){var cs=p.caseStudy;
    if(cs.problem){
      [['Problem',cs.problem],['Solution',cs.solution],['Outcome',cs.outcome]].forEach(function(row){if(row[1])h+='<section class="case-section case-'+row[0].toLowerCase()+'"><h2><span class="case-icon" aria-hidden="true">'+({Problem:'◎',Solution:'⌘',Outcome:'✓'}[row[0]])+'</span><span>'+row[0]+'</span></h2><p data-case-field="'+row[0].toLowerCase()+'">'+esc(row[1])+'</p></section>';});
    }else{
      h+='<section class="case-section"><h2>Project Overview</h2><p data-case-context>'+esc(cs.context||p.descriptionEn||'')+'</p></section>';
      if(cs.features&&cs.features.length)h+='<section class="case-section"><h2>Main Workflows</h2><ul data-case-features>'+cs.features.map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></section>';
      if(cs.scope)h+='<section class="case-section"><h2>Scope &amp; Evidence</h2><p>'+esc(cs.scope)+'</p></section>';
    }
  }
  var tech = Array.isArray(p.tech) ? p.tech : String(p.tech||'').split(',');
  tech = tech.map(function(t){return String(t).trim()}).filter(Boolean);
  if(tech.length){ h += '<h2 style="font:700 20px Sora;margin-top:28px">Stack</h2><div style="display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.2rem">'; tech.forEach(function(t){ h += '<span class="pj-pill">'+esc(t)+'</span>'; }); h += '</div>'; }
  var links = '';
  if(p.demo && !p.demo.includes('example.com')) links += '<a class="pj-btn pj-btn-primary" href="'+esc(p.demo)+'" target="_blank" rel="noopener noreferrer">Open project</a>';
  if(p.github && !p.github.includes('github.com/oaama')) links += '<a class="pj-btn pj-btn-ghost" href="'+esc(p.github)+'" target="_blank" rel="noopener noreferrer">GitHub</a>';
  if(p.drive) links += '<a class="pj-btn pj-btn-ghost" href="'+esc(p.drive)+'" target="_blank" rel="noopener noreferrer">Drive</a>';
  if(links) h += '<div style="display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.6rem">'+links+'</div>';
  app.innerHTML = h;
  var dialog=document.createElement('dialog');dialog.className='shot-dialog';dialog.innerHTML='<form method="dialog"><button class="shot-close" aria-label="Close image">×</button></form><img alt=""><p></p>';document.body.appendChild(dialog);
  var lastShot=null;
  app.querySelectorAll('[data-shot]').forEach(function(b){b.onclick=function(){lastShot=b;var shot=shots[Number(b.dataset.shot)],ar=document.documentElement.lang==='ar';dialog.querySelector('img').src=shot.image;dialog.querySelector('img').alt=ar?(shot.caption||shot.captionEn):(shot.captionEn||shot.caption);dialog.querySelector('p').textContent=dialog.querySelector('img').alt;dialog.showModal();document.body.style.overflow='hidden'}});
  dialog.addEventListener('click',function(e){if(e.target===dialog)dialog.close()});dialog.addEventListener('close',function(){document.body.style.overflow='';if(lastShot)lastShot.focus()});
}).catch(function(e){
  document.getElementById('app').innerHTML = '<p style="color:hsl(var(--muted-foreground))">Could not load this project right now.</p>';
});
</script>
<script src="/project-motion.js" defer></script>
<script src="/language.js" defer></script>
