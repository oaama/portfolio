<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Admin Password Setup</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0f1c;color:#e5e7eb;font-family:ui-sans-serif,system-ui,sans-serif}
  .card{width:100%;max-width:24rem;padding:2rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:1.5rem}
  h1{font-size:1.25rem;margin:0 0 .5rem}
  p{font-size:.8rem;color:#9ca3af;margin:0 0 1.5rem}
  label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:#9ca3af;margin:0 0 .35rem}
  input{width:100%;box-sizing:border-box;height:3rem;padding:0 .9rem;margin-bottom:1rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:.8rem;color:#e5e7eb;font-size:1rem}
  button{width:100%;height:3rem;border:0;border-radius:.8rem;background:#3b82f6;color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
  #msg{margin-top:1rem;font-size:.85rem;min-height:1.2em}
</style>
</head>
<body>
<div class="card">
  <h1>Admin Password Setup</h1>
  <p>One-time credential rotation for the dashboard.</p>
  <form id="f">
    <label for="token">Setup token</label>
    <input id="token" name="token" type="text" autocomplete="off" required/>
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required/>
    <button type="submit">Set password</button>
  </form>
  <div id="msg"></div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var msg = document.getElementById('msg');
  msg.textContent = 'Working...';
  try {
    var r = await fetch('/api/rotate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: document.getElementById('token').value, password: document.getElementById('password').value })
    });
    var j = await r.json();
    msg.textContent = j.success ? 'Password updated. You can log in now.' : (j.error || 'Failed');
    msg.style.color = j.success ? '#4ade80' : '#f87171';
    if (j.success) document.getElementById('f').reset();
  } catch (err) {
    msg.textContent = 'Network error';
    msg.style.color = '#f87171';
  }
});
</script>
</body>
</html>
