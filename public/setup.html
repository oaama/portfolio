<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"/>
<title>Dashboard Setup</title>
<style>
body{background:#0a0a12;color:#e5e7eb;font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
.card{background:#12121e;border:1px solid #26263a;border-radius:16px;padding:32px;width:360px}
h1{font-size:20px;margin:0 0 8px}p{color:#9ca3af;font-size:13px;margin:0 0 20px}
label{display:block;font-size:12px;color:#9ca3af;margin:14px 0 6px}
input{width:100%;box-sizing:border-box;background:#0a0a12;border:1px solid #374151;border-radius:8px;color:#e5e7eb;padding:10px;font-size:14px}
button{margin-top:20px;width:100%;background:#14b8a6;border:0;border-radius:8px;color:#04110f;font-weight:600;padding:11px;font-size:14px;cursor:pointer}
#msg{margin-top:14px;font-size:13px;min-height:18px}
.ok{color:#34d399}.err{color:#f87171}
</style>
</head>
<body>
<div class="card">
<h1>Dashboard Setup</h1>
<p>One-time step: set the admin password for the portfolio dashboard.</p>
<form id="f" autocomplete="off">
<label for="setup-token">Setup token</label>
<input id="setup-token" name="setup_token" type="text" required>
<label for="username">Admin username</label>
<input id="username" name="username" type="text" value="admin" autocomplete="username">
<label for="password">New admin password</label>
<input id="password" name="password" type="password" autocomplete="new-password" required>
<button type="submit">Set password</button>
</form>
<div id="msg"></div>
</div>
<script>
document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  var msg = document.getElementById("msg");
  msg.className = ""; msg.textContent = "Working...";
  try {
    var r = await fetch("/api/setup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: document.getElementById("setup-token").value.trim(), password: document.getElementById("password").value })
    });
    var j = await r.json();
    if (j.success) { msg.className = "ok"; msg.textContent = "Done. Dashboard login is ready at /dash-admin"; }
    else { msg.className = "err"; msg.textContent = j.error || "Setup failed"; }
  } catch (err) { msg.className = "err"; msg.textContent = "Network error"; }
});
</script>
</body>
</html>
