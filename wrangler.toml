name = "angluos"
main = "worker.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

# Google Search Console verification token. This value is public by design
# (Google requires it to be served in a meta tag on the site), so keeping it
# here is safe and makes every deploy, including Cloudflare Workers Builds,
# carry it. The worker injects the verification meta tag into HTML pages
# only while this variable is set.
[vars]
GOOGLE_SITE_VERIFICATION = "Hc9qWWn67abGdHQDyH3kwCWkWJaOhvsLf1bMdKM2BC0"
